# Đổi VERSION trên main → kiểm thử → tag vX.Y.Z + GitHub Release (nguồn + SHA256SUMS + ghi chú từ CHANGELOG.md).
# Không đẩy image (image dựng tại máy người dùng bởi install.sh).
name: release
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    # Chỉ phát hành từ main, kể cả khi chạy tay (workflow_dispatch).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Xác định phiên bản
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d ' \n' < VERSION)"
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION không hợp lệ: $TAG"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Đã có Release $TAG — bỏ qua."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Cài ffmpeg + Chromium
        if: steps.ver.outputs.skip != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core
          sudo apt-get install -y --no-install-recommends chromium || sudo apt-get install -y --no-install-recommends chromium-browser || true
          echo "GS_CHROMIUM_PATH=$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)" >> "$GITHUB_ENV"
          echo "GS_FFMPEG_PATH=$(command -v ffmpeg)" >> "$GITHUB_ENV"
      - name: Kiểm thử
        if: steps.ver.outputs.skip != '1'
        run: bash tools/test.sh
      - name: Đóng gói + ghi chú
        if: steps.ver.outputs.skip != '1'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="gen-studio-${TAG}/" -o "dist/gen-studio-${TAG}.tar.gz" HEAD
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          awk -v v="${TAG#v}" '$0 ~ "^## "v" "{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $TAG" > notes.md
      - name: Tạo Release (kèm tag)
        if: steps.ver.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --target "$GITHUB_SHA" --title "gen-studio $TAG" --notes-file notes.md
