# studio: dữ liệu + dựng hình. agent: container riêng, KHÔNG thấy dữ liệu (chỉ nói chuyện với studio qua /mcp và /oauth/*).
# Agent luôn chạy (trạng thái unpaired). Chủ xưởng bấm "Bật agent nội bộ" trên giao diện → runner tự xin quyền (ghép thiết bị) → bấm Duyệt.
# Token tay (nâng cao, cho agent ngoài): `genstudio token create`. Runner KHÔNG đọc token từ .env.
# voice (tuỳ chọn, profile `voice`): giọng offline không cần khoá — bật bằng `install.sh --voice-offline` hoặc `genstudio voice pull`
# (ghi COMPOSE_PROFILES=voice vào .env). Chỉ ở mạng nội bộ `voice` cùng studio: không cổng ra máy chủ, không egress, không thấy /data.
services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: gen-studio/studio:${GS_VERSION:-local}
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    user: "${GS_UID:-1000}:${GS_GID:-1000}"
    ports:
      - "127.0.0.1:${GS_PORT:-7490}:7490"
    environment:
      DATA_DIR: /data
      GS_PORT: "7490"
      GS_PUBLIC_URL: "${GS_PUBLIC_URL:-}"
      GS_HOST_PORT: "${GS_PORT:-7490}"
      GS_LANG: "${GS_LANG:-vi}"
      # bí mật ghép nội bộ: chỉ studio + agent nhận (biến môi trường, không phải mount dữ liệu); chỉ dùng được trong cửa sổ ghép do chủ xưởng mở
      GS_PAIRING_SECRET: "${GS_PAIRING_SECRET:-}"
      GS_VOICE_URL: http://voice:7491
    volumes:
      - ./data:/data
    networks: [gs, voice]

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: gen-studio/agent:${GS_VERSION:-local}
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      studio:
        condition: service_healthy
    environment:
      GS_MCP_URL: http://studio:7490/mcp
      GS_PAIRING_SECRET: "${GS_PAIRING_SECRET:-}"
    # runner chạy root trong container nhưng chỉ giữ 3 capability để hạ quyền cho Claude CLI con (uid 1000): CLI con không đọc được token.json của runner
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - agent-home:/home/node/.claude
      - agent-state:/agent-state   # token ghép thiết bị (token.json, mode 0600) — chỉ container agent thấy
    networks: [gs]

  voice:
    build:
      context: .
      dockerfile: Dockerfile.voice
    image: gen-studio/voice:${GS_VERSION:-local}
    profiles: [voice]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    command: [serve]
    environment:
      GS_VOICE_PRECISION: "${GS_VOICE_PRECISION:-fp32}"
      GS_VOICE_JUDGE: "${GS_VOICE_JUDGE:-small}"
      GS_VOICE_THREADS: "${GS_VOICE_THREADS:-4}"
    volumes:
      - voice-models:/models:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: "${GS_VOICE_MEM:-3g}"
    networks: [voice]

  # một lần: tải model (ghim revision + sha256) vào volume voice-models — `genstudio voice pull`. Cần mạng ra huggingface.co.
  voice-pull:
    image: gen-studio/voice:${GS_VERSION:-local}
    profiles: [voice-pull]
    command: [pull]
    environment:
      GS_VOICE_PRECISION: "${GS_VOICE_PRECISION:-fp32}"
      GS_VOICE_JUDGE: "${GS_VOICE_JUDGE:-small}"
    volumes:
      - voice-models:/models
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [gs]

networks:
  gs: {}
  # studio ↔ voice: internal ⇒ không ra Internet; agent KHÔNG ở mạng này
  voice:
    internal: true

volumes:
  agent-home: {}
  agent-state: {}
  voice-models: {}
