# studio: dữ liệu + dựng hình. agent: container riêng, KHÔNG thấy dữ liệu (chỉ nói chuyện với studio qua /mcp và /oauth/*).
# Agent luôn chạy (trạng thái unpaired). Chủ xưởng bấm "Bật agent nội bộ" trên giao diện → runner tự xin quyền (ghép thiết bị) → bấm Duyệt.
# Token tay (nâng cao, cho agent ngoài): `genstudio token create`. Runner KHÔNG đọc token từ .env.
services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: gen-studio/studio:${GS_VERSION:-local}
    restart: unless-stopped
    user: "${GS_UID:-1000}:${GS_GID:-1000}"
    ports:
      - "127.0.0.1:${GS_PORT:-7490}:7490"
    environment:
      DATA_DIR: /data
      GS_PORT: "7490"
      GS_PUBLIC_URL: "${GS_PUBLIC_URL:-}"
      GS_LANG: "${GS_LANG:-vi}"
    volumes:
      - ./data:/data
    networks: [gs]

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: gen-studio/agent:${GS_VERSION:-local}
    restart: unless-stopped
    depends_on:
      studio:
        condition: service_healthy
    environment:
      GS_MCP_URL: http://studio:7490/mcp
    # runner chạy root trong container nhưng chỉ giữ 3 capability để hạ quyền cho Claude CLI con (uid 1000): CLI con không đọc được token.json của runner
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - agent-home:/home/node/.claude
      - agent-state:/agent-state   # token ghép thiết bị (token.json, mode 0600) — chỉ container agent thấy
    networks: [gs]

networks:
  gs: {}

volumes:
  agent-home: {}
  agent-state: {}
